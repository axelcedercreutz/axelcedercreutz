name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero dependencies: nothing to install. The tests parse index.html directly.
      - run: npm test
